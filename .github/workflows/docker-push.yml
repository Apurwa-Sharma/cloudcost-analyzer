
name: Docker Push

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  push-images:
    name: Build and push images to Amazon ECR
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate AWS and ECR configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
        run: |
          missing=()

          [[ -n "$AWS_REGION" ]] || missing+=("AWS_REGION")
          [[ -n "$AWS_ROLE_ARN" ]] || missing+=("AWS_ROLE_ARN")
          [[ -n "$ECR_FRONTEND_REPOSITORY" ]] || missing+=("ECR_FRONTEND_REPOSITORY")
          [[ -n "$ECR_BACKEND_REPOSITORY" ]] || missing+=("ECR_BACKEND_REPOSITORY")

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub variables: %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws(-[a-z]+)?:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::Invalid AWS_ROLE_ARN."
            exit 1
          fi

          echo "AWS and ECR configuration validated."

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Resolve ECR image names
        id: ecr
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${ECR_FRONTEND_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${ECR_BACKEND_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and push frontend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.frontend_image }}:latest

      - name: Build and push backend image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.backend_image }}:latest
